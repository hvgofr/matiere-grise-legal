<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nouveau mot de passe — Matière Grise</title>
<style>
  :root{
    --fond:#212126;--carte:#2A2A30;--texte:#F1F0F4;--doux:#B8B7C0;--sourd:#86858F;
    --accent:#4F5FE8;--bord:rgba(240,240,244,.12);--bon:#3DDC84;--rate:#FF5566;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:var(--fond);color:var(--texte);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif;
    line-height:1.6;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .carte{max-width:420px;width:100%;background:var(--carte);border:1px solid var(--bord);border-radius:18px;padding:28px 24px}
  h1{font-size:22px;font-weight:700;margin:0 0 8px;letter-spacing:-.01em}
  p{color:var(--doux);font-size:14.5px;margin:0 0 18px}
  input{
    width:100%;padding:12px 14px;margin-bottom:10px;border-radius:10px;
    border:1px solid var(--bord);background:#1C1C21;color:var(--texte);font-size:15px;
  }
  input:focus{outline:none;border-color:var(--accent)}
  button{
    width:100%;padding:13px;border:none;border-radius:10px;background:var(--accent);
    color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px;
  }
  button:disabled{opacity:.5;cursor:default}
  .avert{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:14px;display:none;border:1px solid}
  .ok{border-color:rgba(61,220,132,.4);background:rgba(61,220,132,.1);color:var(--bon)}
  .err{border-color:rgba(255,85,102,.4);background:rgba(255,85,102,.1);color:var(--rate)}
</style>
</head>
<body>
<div class="carte">
  <h1>Nouveau mot de passe</h1>
  <p id="intro">Choisis un nouveau mot de passe pour ton compte Matière Grise.</p>

  <div id="formulaire">
    <input type="password" id="mdp1" placeholder="Nouveau mot de passe" autocomplete="new-password">
    <input type="password" id="mdp2" placeholder="Confirmer le mot de passe" autocomplete="new-password">
    <button id="valider">Enregistrer</button>
  </div>

  <div class="avert" id="avert"></div>
</div>

<script>
const CONFIG = {
  url: "https://upvgyiutfadrmolhmnsz.supabase.co",
  cle: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVwdmd5aXV0ZmFkcm1vbGhtbnN6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MzI2NDQsImV4cCI6MjEwMzMwODY0NH0.SuTIe-cRBueBRqVAXRLubUZCXHAhEIJ78ZnxCi1uMn4"
};

function avert(texte, ok) {
  const el = document.getElementById("avert");
  el.textContent = texte;
  el.style.display = "block";
  el.className = "avert " + (ok ? "ok" : "err");
}

// Supabase renvoie les jetons dans le fragment de l'URL (après le #),
// jamais dans les paramètres classiques — c'est délibéré, pour qu'ils ne
// transitent jamais par un serveur, y compris celui qui héberge cette page.
const params = new URLSearchParams(location.hash.replace(/^#/, ""));
const accessToken = params.get("access_token");
const type = params.get("type");
const erreurLien = params.get("error_description");

if (erreurLien) {
  document.getElementById("intro").textContent = "";
  document.getElementById("formulaire").style.display = "none";
  avert("Lien invalide ou expiré : " + decodeURIComponent(erreurLien.replace(/\+/g, " ")) +
    ". Redemande une réinitialisation depuis l'app.", false);
} else if (!accessToken || type !== "recovery") {
  document.getElementById("intro").textContent = "";
  document.getElementById("formulaire").style.display = "none";
  avert("Ce lien n'est pas valide. Ouvre-le directement depuis l'email reçu, sans le copier ailleurs.", false);
} else {
  document.getElementById("valider").onclick = async () => {
    const m1 = document.getElementById("mdp1").value;
    const m2 = document.getElementById("mdp2").value;
    if (m1.length < 8) { avert("Le mot de passe doit faire au moins 8 caractères.", false); return; }
    if (m1 !== m2) { avert("Les deux mots de passe diffèrent.", false); return; }
    document.getElementById("valider").disabled = true;
    document.getElementById("valider").textContent = "Enregistrement…";
    try {
      const rep = await fetch(CONFIG.url + "/auth/v1/user", {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "apikey": CONFIG.cle,
          "Authorization": "Bearer " + accessToken
        },
        body: JSON.stringify({password: m1})
      });
      if (!rep.ok) {
        const d = await rep.json().catch(() => ({}));
        throw new Error(d.msg || d.error_description || "Le serveur a refusé la demande.");
      }
      document.getElementById("formulaire").style.display = "none";
      avert("Mot de passe modifié. Tu peux retourner dans l'app Matière Grise et te connecter avec ton nouveau mot de passe.", true);
    } catch (e) {
      avert(e.message || "Une erreur est survenue, réessaie.", false);
      document.getElementById("valider").disabled = false;
      document.getElementById("valider").textContent = "Enregistrer";
    }
  };
}
</script>
</body>
</html>
